<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>V-Day Link Maker 💌</title>
  <meta name="description" content="Type your name and hers. Get a link. Send it." />
  <meta property="og:title" content="V-Day Link Maker 💌" />
  <meta property="og:description" content="Type your name and hers. Get a link. Send it." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="card" id="makeView">
    <div class="big-emoji" aria-hidden="true">💌</div>
    <p class="eyebrow">V-Day Link Maker</p>
    <h1>Ask her out. In style.</h1>
    <p class="sub">Type your name and hers. You get a link. Send it to her. Only the names change, everything else is already done.</p>

    <form id="makeForm" novalidate>
      <label class="field">
        <span>Your name (the one asking)</span>
        <input id="fromInput" type="text" maxlength="30" autocomplete="given-name" placeholder="Your name here" />
      </label>
      <label class="field">
        <span>Her name</span>
        <input id="toInput" type="text" maxlength="30" autocomplete="off" placeholder="e.g. Ana" />
      </label>
      <button class="btn yes" type="submit">Make my link 💖</button>
      <p class="hint" id="formHint" role="alert"></p>
    </form>

    <section class="result hidden" id="result">
      <p class="eyebrow">Your link is ready</p>
      <input id="linkOut" type="text" readonly aria-label="Your link" />
      <div class="row">
        <button class="btn small" id="copyBtn" type="button">Copy</button>
        <button class="btn small" id="shareBtn" type="button">Share</button>
        <a class="btn small" id="previewLink" href="ask.html" target="_blank" rel="noopener">Preview</a>
      </div>
      <p class="hint" id="resultHint"></p>
    </section>
  </main>

  <script src="create.js"></script>
</body>
</html>
