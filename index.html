<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A Question from Sergjo 💌</title>
  <meta name="description" content="A small question, asked properly." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <!-- ASK VIEW -->
  <main class="card" id="askView">
    <div class="big-emoji" id="emoji" aria-hidden="true">🌹</div>
    <p class="eyebrow">A little note from Sergjo</p>
    <h1 id="title">Will you be my Valentine?</h1>
    <p class="sub" id="sub">I could have just texted you, but this felt more fun.</p>

    <div class="buttons" id="buttons">
      <button class="btn yes" id="yesBtn" type="button">Yes 💖</button>
      <button class="btn no" id="noBtn" type="button">No</button>
    </div>

    <p class="hint" id="hint">(Take your time. The "No" button is a bit shy.)</p>
  </main>

  <!-- YES VIEW -->
  <main class="card hidden" id="yesView" aria-live="polite">
    <div class="big-emoji pop" aria-hidden="true">🥰</div>
    <h1 id="yesTitle">She said yes!</h1>
    <p class="sub">You just made my whole week. Now the important part: what's the plan?</p>

    <div class="plans" id="plans" role="radiogroup" aria-label="Pick a date plan">
      <button type="button" class="plan" role="radio" aria-checked="false" data-plan="a cozy dinner 🍝">🍝 Cozy dinner</button>
      <button type="button" class="plan" role="radio" aria-checked="false" data-plan="coffee and a long walk ☕">☕ Coffee + walk</button>
      <button type="button" class="plan" role="radio" aria-checked="false" data-plan="a movie night 🎬">🎬 Movie night</button>
      <button type="button" class="plan" role="radio" aria-checked="false" data-plan="a surprise (your pick, my plan) 🎁">🎁 Surprise me</button>
    </div>

    <button class="btn yes send" id="sendBtn" type="button" disabled>Pick a plan first</button>
    <p class="hint" id="sendHint"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
